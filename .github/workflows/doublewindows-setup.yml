name: Build DoubleWindows Setup

on:
  workflow_dispatch:
  push:
    paths:
      - "DoubleWindows/**"
      - ".github/workflows/doublewindows-setup.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python-arch: x64
          - arch: x86
            python-arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}

      - name: Install dependencies
        working-directory: DoubleWindows
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application
        working-directory: DoubleWindows
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DoubleWindows app.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Chocolatey returned a non-zero code; checking whether Inno Setup is already installed."
          }

      - name: Build installer
        working-directory: DoubleWindows
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\lib\innosetup\tools\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            $found = Get-ChildItem -Path "$env:ProgramFiles(x86)","$env:ProgramFiles","$env:ChocolateyInstall\lib" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found. Checked standard installation paths." }
          Write-Host "Using Inno Setup compiler: $iscc"
          New-Item -ItemType Directory -Force -Path output | Out-Null
          & $iscc "/DArch=${{ matrix.arch }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DoubleWindows-Setup-${{ matrix.arch }}
          path: DoubleWindows/output/DoubleWindows-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30
